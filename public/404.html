<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — Engenharia NATA</title>
    <script>
      // Atalho das lojas: engnata.eu/<nome> leva à loja <nome>.engnata.eu.
      // Só caminhos de um nível no formato de endereço de loja (3 a 40 letras, números
      // ou hífen). sites.engnata.eu/ir/<nome> confere se a loja existe e está publicada;
      // se não estiver, mostra "não encontramos" lá mesmo.
      (function () {
        var m = /^\/([a-z0-9][a-z0-9-]{1,38}[a-z0-9])\/?$/i.exec(
          location.pathname,
        );
        if (m && m[1].indexOf("--") === -1) {
          location.replace("https://sites.engnata.eu/ir/" + m[1].toLowerCase());
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        background: #faf8f5;
        color: #333;
      }
      main {
        max-width: 30rem;
        text-align: center;
      }
      h1 {
        font:
          500 26px/1.3 Georgia,
          serif;
        margin: 0 0 16px;
      }
      p {
        margin: 0 0 8px;
        color: #6b665e;
      }
      a {
        color: #8b6347;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #16150f;
          color: #f1eee8;
        }
        p {
          color: #aaa498;
        }
        a {
          color: #d4b56a;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p lang="pt-BR">Página não encontrada.</p>
      <p lang="it-IT">Pagina non trovata.</p>
      <p lang="sv-SE">Sidan hittades inte.</p>
      <p style="margin-top: 20px"><a href="/">engnata.eu</a></p>
    </main>
  </body>
</html>

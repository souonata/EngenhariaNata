<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://souonata.goatcounter.com https://*.open-meteo.com https://docs.google.com https://script.google.com; frame-src https://docs.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://docs.google.com; upgrade-insecure-requests;">
<meta name="theme-color" content="#0b1220">
<title>Previsão 7 dias</title>
<script data-goatcounter="https://souonata.goatcounter.com/count"

<link rel="stylesheet" href="../assets/css/dock-global.css?v=1.1.0">

<body>


<div class="screen">
  <div class="app" id="app" style="display:none;flex:1;flex-direction:column;min-height:0">

    <nav class="cities" id="cityBtns"></nav>

    <main class="days" id="days"></main>

    <footer class="footer">
      <span id="footLoc">📍 —</span>
      <span><span id="sourceLbl">Fonte: </span><a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a></span>
    </footer>
  </div>
</div>

<footer class="site-footer">
  <p id="footerBrand">💻 Portfólio Engenharia NATA @ 2026</p>
  <div class="footer-meta">
    <a class="footer-github-link" href="https://github.com/souonata/EngenhariaNata" target="_blank" rel="noopener noreferrer" aria-label="GitHub EngenhariaNata">

      <span>github.com/souonata/EngenhariaNata</span>
    </a>
  </div>
</footer>

<a href="../index.html" class="home-button-fixed" title="Voltar para a tela inicial" aria-label="Voltar para a tela inicial">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true">
    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
  </svg>
</a>

<div id="loading" class="overlay">
  <div class="spinner"></div>
  <div class="err-msg" id="loadingMsg">Carregando previsão…</div>
</div>

<div id="error" class="overlay" style="display:none">
  <div class="err-ico">⚠️</div>
  <div class="err-msg" id="errMsg">Erro ao carregar dados.</div>
  <button class="btn" id="retryBtn" onclick="location.reload()">Tentar novamente</button>
</div>

<div id="search" class="overlay search-overlay" style="display:none">
  <div class="search-box">
    <div class="search-row">
      <span class="search-ico">🔍</span>
      <input id="searchInput" type="text" autocomplete="off" placeholder="Digite uma cidade…" />
      <button class="search-x" id="searchClose" aria-label="Fechar">✕</button>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<div id="hourTip" style="display:none" aria-live="polite"></div>

<script type="module" src="previsao-script.js?v=1.1.0"></script>
</body>
</html>

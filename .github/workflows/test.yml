name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Vitest + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: local
        run: npm ci

      - name: Run unit tests
        working-directory: local
        run: npm test

      - name: Production build (smoke)
        working-directory: local
        run: npm run build

  pintor-python:
    name: Pintor Python safety suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pintor/pyproject.toml

      - name: Install Pintor with web boundary
        run: python -m pip install -e './pintor[web]'

      - name: Run standalone safety and web tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PINTOR_COOKIE_SECURE: '0'
        run: python -m unittest discover -s pintor/tests -p 'test_wirecolor*.py'

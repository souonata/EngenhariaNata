[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pintor-wiring"
version = "3.1.8"
description = "Conservative, review-first wiring-diagram colourizer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "Pillow>=10",
  # PyMuPDF 2.0 judges a full-page scan with stray vector ink as trustworthy vector geometry
  # (test_full_page_image_with_stray_ink_is_declined). Lift the ceiling only after that tier is
  # re-measured on 2.x.
  "PyMuPDF>=1.24,<2",
  "scikit-image>=0.22",
  "scipy>=1.11",
]

[project.optional-dependencies]
learning = ["optuna>=4.0,<5"]
# Training WireNet only; the painter runs its ONNX export through onnxruntime (the ocr extra).
# A CUDA build of torch comes from the PyTorch index, e.g. --index-url .../whl/cu128.
wirenet = ["torch>=2.4", "onnx>=1.16"]
ocr = ["rapidocr==3.9.2", "onnxruntime==1.29.0"]
web = [
  "fastapi>=0.117,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]
test = ["httpx2==2.12.0"]
dev = []

[project.scripts]
pintor = "wirecolor.tools.paint_vector:main"
pintor-review = "wirecolor.tools.qa_dashboard:main"
pintor-train = "wirecolor.tools.cross_validate_learning:main"
pintor-web = "wirecolor.web_service:main"
pintor-hash-password = "wirecolor.tools.hash_password:main"
pintor-inventory = "wirecolor.tools.inventory_wiring_pages:main"
pintor-verify-inventory = "wirecolor.tools.verify_wiring_inventory:main"
pintor-review-inventory = "wirecolor.tools.review_wiring_inventory:main"
pintor-bench = "wirecolor.tools.feedback_bench:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wirecolor = ["conventions/*.json", "policies/*.json"]
